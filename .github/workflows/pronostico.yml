name: Entrenar pronóstico

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Entrenar aunque no haya cargas nuevas"
        type: boolean
        default: false

concurrency:
  group: pronostico
  cancel-in-progress: false

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: motor/requirements.txt
      - run: pip install -r motor/requirements.txt
      - name: Entrenar y publicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python motor/nube.py ${{ github.event.inputs.forzar == 'true' && '--forzar' || '' }}
